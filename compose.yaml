name: business-intelligence-2

x-application: &application
  image: business-intelligence-2:local
  build:
    context: .
    target: runtime
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ConnectionStrings__Application: Host=postgres;Database=business_intelligence;Username=bi_local;Timeout=5;CommandTimeout=30;GSS Encryption Mode=Disable
    Database__PasswordFile: /run/secrets/postgres_password
  secrets:
    - postgres_password
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true

# Everything here belongs to this repository alone: its own project, database volume, network and port. Nothing is
# shared with the older business-intelligence stack, which may run on the same machine.
services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: business_intelligence
      POSTGRES_USER: bi_local
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    # Sized for the national imports (millions of rows per transaction, trigram and GIN index builds).
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
    shm_size: 1g
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bi_local -d business_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 3g
    cpus: 4

  migrate:
    <<: *application
    command: [database, migrate, --confirm-database, business_intelligence]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    mem_limit: 256m

  web:
    <<: *application
    ports:
      - "127.0.0.1:${BI_HTTP_PORT:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1

  # Operator imports: `docker compose --profile import run --rm import <command> ...`. The downloaded source files are
  # mounted read-only at /data/raw; the catalog pins each one by size and SHA-256.
  import:
    <<: *application
    profiles: [import]
    volumes:
      - ./.research/raw:/data/raw:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"
    # SEAP workbooks keep about a million distinct strings in memory while a sheet is read.
    mem_limit: 2560m
    cpus: 2

  verify:
    profiles: [verify]
    image: business-intelligence-2-verify:local
    build:
      context: .
      target: verify
    volumes:
      - ./.artifacts/docker/verification:/source/.artifacts
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 2g
    cpus: 2

secrets:
  postgres_password:
    file: ./.artifacts/docker/postgres-password

volumes:
  postgres-data:
    name: business-intelligence-2-postgres-data

networks:
  default:
    name: business-intelligence-2
