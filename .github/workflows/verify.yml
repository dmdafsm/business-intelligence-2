name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate integration PR branches
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/branch_policy.py pr
      - name: Set up isolated PostgreSQL tests
        if: ${{ hashFiles('tests/**/BusinessIntelligence.Tests.csproj') != '' }}
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-16
          fi
          echo "BI_TEST_POSTGRES_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: Verify repository and applicable application stacks
        run: python3 scripts/verify.py
      - name: Upload backend test evidence
        if: ${{ always() && hashFiles('.artifacts/test-results/**/*.trx') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: .artifacts/test-results/**/*.trx
          include-hidden-files: true
          retention-days: 7
      - name: Upload browser test evidence
        if: ${{ always() && hashFiles('.artifacts/browser-tests/**/*') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-evidence
          path: .artifacts/browser-tests/
          include-hidden-files: true
          retention-days: 7

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare private local inputs
        run: python3 scripts/prepare_docker.py
      - name: Validate and start the local stack
        env:
          # Hosted runners have 2 CPUs; Docker refuses a larger limit.
          BI_POSTGRES_CPUS: "2"
        run: |
          docker compose config --quiet
          docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify application and database readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8090/health/live
          curl --fail --silent --show-error http://127.0.0.1:8090/health/ready
      - name: Show diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove this job's disposable stack
        if: always()
        run: docker compose down --volumes
